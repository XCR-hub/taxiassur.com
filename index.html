<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <!-- Critical preconnect -->
  <link rel="preconnect" href="https://qiavtxpaznxpttkdaevy.supabase.co" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Fonts: non-blocking (display=swap) -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" /></noscript>

  <!-- Inline critical CSS for instant paint -->
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html{overflow-x:hidden;max-width:100vw;scroll-behavior:smooth}
    body{font-family:'Inter',system-ui,-apple-system,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased;background:#0a0a0a;color:#fff;overflow-x:hidden;max-width:100vw}
    #root{min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}
    .loading-screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0a0a0a;z-index:9999;flex-direction:column;gap:16px}
    .loading-spinner{width:40px;height:40px;border:3px solid rgba(212,175,55,0.2);border-top:3px solid #D4AF37;border-radius:50%;animation:spin 0.8s linear infinite}
    .loading-text{color:#D4AF37;font-size:14px;font-weight:600;letter-spacing:.05em}
    @keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
    /* Critical above-fold: header height reservation prevents CLS */
    header{min-height:80px}
    @media(max-width:640px){header{min-height:72px}}
  </style>

  <title>TaxiAssur - Assurance Taxi Pas Cher | Devis Gratuit</title>

  <!-- env-config loaded async to avoid render blocking -->
  <script>
    (function() {
      var s = document.createElement('script');
      s.src = '/env-config.js';
      s.async = true;
      document.head.appendChild(s);
    })();
  </script>
</head>
<body>
  <div id="root">
    <div class="loading-screen">
      <div class="loading-spinner"></div>
      <span class="loading-text">TaxiAssur</span>
    </div>
  </div>

  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
