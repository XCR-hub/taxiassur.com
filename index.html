    .loading-spinner{width:40px;height:40px;border:3px solid rgba(212,175,55,0.2);border-top:3px solid #D4AF37;border-radius:50%;animation:spin 0.8s linear infinite}
    .loading-text{color:#D4AF37;font-size:14px;font-weight:600;letter-spacing:.05em}

    /* Header CLS prevention */
    header{min-height:80px;contain:layout style}

      .backdrop-blur-lg{backdrop-filter:none !important;-webkit-backdrop-filter:none !important}
      .backdrop-blur-sm{backdrop-filter:none !important;-webkit-backdrop-filter:none !important}
    }
    /* Font display: use system font until Inter loads — zero layout shift */
