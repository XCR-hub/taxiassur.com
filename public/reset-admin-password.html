<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réinitialisation Mot de Passe Admin - TaxiAssur</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            color: #1a202c;
            margin-bottom: 8px;
            font-size: 28px;
            text-align: center;
        }
        .subtitle {
            color: #718096;
            margin-bottom: 32px;
            text-align: center;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 24px;
        }
        label {
            display: block;
            color: #2d3748;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 14px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 15px;
            transition: border-color 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #f5576c;
        }
        .btn {
            width: 100%;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            font-size: 16px;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(245, 87, 108, 0.4);
        }
        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(245, 87, 108, 0.5);
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .alert {
            padding: 16px;
            border-radius: 10px;
            margin-bottom: 24px;
            font-size: 14px;
            line-height: 1.5;
        }
        .alert-success {
            background: #f0fff4;
            color: #22543d;
            border: 2px solid #48bb78;
        }
        .alert-error {
            background: #fff5f5;
            color: #742a2a;
            border: 2px solid #f56565;
        }
        .alert-info {
            background: #ebf8ff;
            color: #2c5282;
            border: 2px solid #4299e1;
        }
        .icon {
            display: inline-block;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }
        .divider {
            text-align: center;
            margin: 32px 0;
            color: #a0aec0;
            font-size: 14px;
        }
        .link {
            color: #f5576c;
            text-decoration: none;
            font-weight: 600;
        }
        .link:hover {
            text-decoration: underline;
        }
        .instructions {
            background: #f7fafc;
            border-radius: 10px;
            padding: 20px;
            margin-top: 32px;
            border-left: 4px solid #4299e1;
        }
        .instructions h3 {
            color: #2d3748;
            font-size: 16px;
            margin-bottom: 12px;
        }
        .instructions ul {
            list-style: none;
            padding-left: 0;
        }
        .instructions li {
            color: #4a5568;
            font-size: 14px;
            margin-bottom: 8px;
            padding-left: 24px;
            position: relative;
        }
        .instructions li:before {
            content: "✓";
            position: absolute;
            left: 0;
            color: #48bb78;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🔑</div>
        <h1>Réinitialisation Mot de Passe</h1>
        <p class="subtitle">Admin Backoffice TaxiAssur</p>

        <div id="alertContainer"></div>

        <form id="resetForm">
            <div class="form-group">
                <label for="email">Email Admin</label>
                <input
                    type="email"
                    id="email"
                    placeholder="master@taxiassur.com"
                    required
                    value="master@taxiassur.com"
                >
            </div>

            <button type="submit" class="btn" id="submitBtn">
                Envoyer le lien de réinitialisation
            </button>
        </form>

        <div class="divider">ou</div>

        <form id="updatePasswordForm" style="display:none;">
            <div class="form-group">
                <label for="newPassword">Nouveau Mot de Passe</label>
                <input
                    type="password"
                    id="newPassword"
                    placeholder="Minimum 6 caractères"
                    required
                    minlength="6"
                >
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirmer le Mot de Passe</label>
                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirmez votre mot de passe"
                    required
                    minlength="6"
                >
            </div>

            <button type="submit" class="btn" id="updateBtn">
                Mettre à jour le mot de passe
            </button>
        </form>

        <div class="instructions">
            <h3>📋 Instructions</h3>
            <ul>
                <li>Entrez votre email admin</li>
                <li>Cliquez sur "Envoyer le lien"</li>
                <li>Vérifiez votre boîte mail</li>
                <li>Cliquez sur le lien reçu</li>
                <li>Définissez votre nouveau mot de passe</li>
            </ul>
        </div>

        <div style="text-align: center; margin-top: 24px;">
            <a href="/backoffice" class="link">← Retour à la connexion</a>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://drohhxrkoequjphvabvq.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRyb2hoeHJrb2VxdWpwaHZhYnZxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTk3ODM3NjAsImV4cCI6MjA3NTM1OTc2MH0.LP9fh10fY0nRDjpG4VW2yGZ5sT4BkiDalox8ToMbMlg';

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function showAlert(message, type = 'info') {
            const alertContainer = document.getElementById('alertContainer');
            alertContainer.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
        }

        // Vérifier si on est en mode "update password" (après avoir cliqué sur le lien)
        const hashParams = new URLSearchParams(window.location.hash.substring(1));
        const accessToken = hashParams.get('access_token');

        if (accessToken) {
            document.getElementById('resetForm').style.display = 'none';
            document.getElementById('updatePasswordForm').style.display = 'block';
            showAlert('✅ Lien valide ! Définissez votre nouveau mot de passe ci-dessous.', 'success');
        }

        // Formulaire de demande de réinitialisation
        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const btn = document.getElementById('submitBtn');

            btn.disabled = true;
            btn.textContent = '⏳ Envoi en cours...';

            try {
                const { error } = await supabase.auth.resetPasswordForEmail(email, {
                    redirectTo: `${window.location.origin}/reset-admin-password.html`
                });

                if (error) throw error;

                showAlert(
                    `✅ Email envoyé ! Vérifiez votre boîte mail (${email}). Le lien est valide pendant 1 heure.`,
                    'success'
                );

                btn.textContent = '✓ Email envoyé';
            } catch (error) {
                console.error('Error:', error);
                showAlert(`❌ Erreur: ${error.message}`, 'error');
                btn.disabled = false;
                btn.textContent = 'Envoyer le lien de réinitialisation';
            }
        });

        // Formulaire de mise à jour du mot de passe
        document.getElementById('updatePasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const btn = document.getElementById('updateBtn');

            if (newPassword !== confirmPassword) {
                showAlert('❌ Les mots de passe ne correspondent pas', 'error');
                return;
            }

            if (newPassword.length < 6) {
                showAlert('❌ Le mot de passe doit contenir au moins 6 caractères', 'error');
                return;
            }

            btn.disabled = true;
            btn.textContent = '⏳ Mise à jour...';

            try {
                const { error } = await supabase.auth.updateUser({
                    password: newPassword
                });

                if (error) throw error;

                showAlert(
                    '✅ Mot de passe mis à jour avec succès ! Vous allez être redirigé vers la page de connexion...',
                    'success'
                );

                setTimeout(() => {
                    window.location.href = '/backoffice';
                }, 3000);

            } catch (error) {
                console.error('Error:', error);
                showAlert(`❌ Erreur: ${error.message}`, 'error');
                btn.disabled = false;
                btn.textContent = 'Mettre à jour le mot de passe';
            }
        });
    </script>
</body>
</html>
