<svg width="200" height="60" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient principal taxi -->
    <linearGradient id="taxiGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="50%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    
    <!-- Ombre portée -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    
    <!-- Brillance -->
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0)"/>
      <stop offset="50%" style="stop-color:rgba(255,255,255,0.3)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>
  
  <!-- Forme principale du taxi (rectangle arrondi) -->
  <rect x="10" y="15" width="180" height="30" rx="8" ry="8" 
        fill="url(#taxiGradient)" 
        stroke="#d97706" 
        stroke-width="1.5"
        filter="url(#dropShadow)"/>
  
  <!-- Bordure intérieure pour l'effet 3D -->
  <rect x="12" y="17" width="176" height="26" rx="6" ry="6" 
        fill="none" 
        stroke="rgba(0,0,0,0.2)" 
        stroke-width="0.5"/>
  
  <!-- Effet de brillance -->
  <rect x="12" y="17" width="176" height="8" rx="6" ry="6" 
        fill="url(#shine)" 
        opacity="0.6"/>
  
  <!-- Texte TAXIASSUR -->
  <text x="100" y="35" 
        font-family="Arial, sans-serif" 
        font-size="14" 
        font-weight="900" 
        text-anchor="middle" 
        fill="#000000"
        letter-spacing="0.5px">TAXIASSUR</text>
  
  <!-- Petit reflet sur le texte -->
  <text x="100" y="35" 
        font-family="Arial, sans-serif" 
        font-size="14" 
        font-weight="900" 
        text-anchor="middle" 
        fill="rgba(255,255,255,0.2)"
        letter-spacing="0.5px"
        transform="translate(0,-0.5)">TAXIASSUR</text>
</svg>