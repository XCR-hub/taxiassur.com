<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test IMAP IONOS - TaxiAssur</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
      background: #f5f5f5;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }
    h1 {
      color: #1e40af;
      margin-bottom: 8px;
    }
    .status {
      padding: 12px;
      border-radius: 8px;
      margin: 16px 0;
    }
    .success {
      background: #dcfce7;
      color: #166534;
      border: 2px solid #86efac;
    }
    .error {
      background: #fee2e2;
      color: #991b1b;
      border: 2px solid #fca5a5;
    }
    .info {
      background: #dbeafe;
      color: #1e40af;
      border: 2px solid #93c5fd;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
      margin-right: 12px;
    }
    button:hover {
      background: #1d4ed8;
    }
    button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 3px solid rgba(255,255,255,.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 1s ease-in-out infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    code {
      background: #f1f5f9;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 14px;
    }
    .detail {
      margin: 8px 0;
      padding: 8px;
      background: #f8fafc;
      border-radius: 6px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🔧 Test IMAP IONOS</h1>
    <p style="color: #64748b;">Configuration et test de la connexion email team@taxiassur.com</p>
  </div>

  <div class="card">
    <h3>📋 Configuration actuelle</h3>
    <div id="config"></div>
  </div>

  <div class="card">
    <h3>🚀 Actions</h3>
    <button onclick="checkConfig()">1. Vérifier la configuration</button>
    <button onclick="testConnection()">2. Tester la connexion IMAP</button>
    <button onclick="syncEmails()">3. Synchroniser les emails</button>
  </div>

  <div id="result"></div>

  <script>
    const SUPABASE_URL = 'https://drohhxrkoequjphvabvq.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRyb2hoeHJrb2VxdWpwaHZhYnZxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTk3ODM3NjAsImV4cCI6MjA3NTM1OTc2MH0.LP9fh10fY0nRDjpG4VW2yGZ5sT4BkiDalox8ToMbMlg';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    function showResult(type, title, message, details = null) {
      const html = `
        <div class="card">
          <div class="status ${type}">
            <strong>${title}</strong>
            <p style="margin: 8px 0 0 0;">${message}</p>
            ${details ? `<div class="detail">${details}</div>` : ''}
          </div>
        </div>
      `;
      document.getElementById('result').innerHTML = html;
    }

    async function checkConfig() {
      showResult('info', '⏳ Chargement...', 'Vérification de la configuration...');

      try {
        const { data, error } = await supabase
          .from('email_accounts')
          .select('*')
          .eq('email', 'team@taxiassur.com')
          .maybeSingle();

        if (error) throw error;

        if (!data) {
          showResult('error', '❌ Compte non trouvé',
            'Le compte team@taxiassur.com n\'existe pas dans la base de données.');
          return;
        }

        const configHtml = `
          <div class="detail">
            <strong>Email:</strong> ${data.email}<br>
            <strong>IMAP Host:</strong> ${data.imap_host}<br>
            <strong>IMAP Port:</strong> ${data.imap_port}<br>
            <strong>IMAP Username:</strong> ${data.imap_username || 'Non configuré'}<br>
            <strong>Mot de passe:</strong> ${data.imap_password_encrypted ? '✓ Configuré' : '✗ Manquant'}<br>
            <strong>Active:</strong> ${data.is_active ? '✓ Oui' : '✗ Non'}<br>
            <strong>Dernière sync:</strong> ${data.last_sync_at ? new Date(data.last_sync_at).toLocaleString('fr-FR') : 'Jamais'}
          </div>
        `;
        document.getElementById('config').innerHTML = configHtml;

        if (data.imap_password_encrypted) {
          showResult('success', '✅ Configuration OK',
            'Le compte est correctement configuré avec mot de passe IMAP.',
            'Vous pouvez maintenant tester la connexion et synchroniser les emails.');
        } else {
          showResult('error', '⚠️ Mot de passe manquant',
            'Le mot de passe IMAP n\'est pas configuré.',
            'Le mot de passe a été configuré : <code>TaxiAssur2025!,&</code>');
        }
      } catch (error) {
        showResult('error', '❌ Erreur', error.message);
      }
    }

    async function testConnection() {
      showResult('info', '⏳ Test en cours...',
        'Test de connexion IMAP à imap.ionos.fr:993...',
        '<div class="spinner"></div> Connexion au serveur IMAP...');

      try {
        const response = await fetch(`${SUPABASE_URL}/functions/v1/sync-ionos-imap`, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${SUPABASE_KEY}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ test: true })
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }

        const result = await response.json();

        showResult('success', '✅ Connexion réussie !',
          'La connexion IMAP fonctionne correctement.',
          `Réponse du serveur : ${JSON.stringify(result, null, 2)}`);
      } catch (error) {
        showResult('error', '❌ Échec de connexion',
          error.message,
          'Vérifiez que le mot de passe IMAP est correct et que l\'edge function est déployée.');
      }
    }

    async function syncEmails() {
      showResult('info', '⏳ Synchronisation...',
        'Récupération des emails depuis IONOS...',
        '<div class="spinner"></div> Cette opération peut prendre 30-60 secondes...');

      try {
        const response = await fetch(`${SUPABASE_URL}/functions/v1/sync-ionos-imap`, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${SUPABASE_KEY}`,
            'Content-Type': 'application/json'
          }
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }

        const result = await response.json();

        // Compter les emails
        const { count } = await supabase
          .from('email_messages')
          .select('*', { count: 'exact', head: true });

        showResult('success', '✅ Synchronisation réussie !',
          `${count || 0} emails récupérés et stockés dans la base de données.`,
          `<a href="/backoffice/crm-killer/inbox" style="color: #2563eb; font-weight: 600;">→ Voir les emails dans l'inbox</a>`);
      } catch (error) {
        showResult('error', '❌ Échec de synchronisation',
          error.message,
          'L\'edge function sync-ionos-imap retourne une erreur. Vérifiez les logs Supabase.');
      }
    }

    // Charger la config au démarrage
    checkConfig();
  </script>
</body>
</html>
