<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Réinitialisation TaxiAssur</title></head>
<body style="font-family:system-ui;background:#0a0a0a;color:#fff;display:grid;place-items:center;min-height:100vh;margin:0">
  <main style="text-align:center;padding:24px"><h1>Réinitialisation de la connexion…</h1><p>Veuillez patienter quelques secondes.</p></main>
  <script>
    (async () => {
      const params = new URLSearchParams(location.search);
      const requested = params.get('next') || '/backoffice';
      const next = requested.startsWith('/') && !requested.startsWith('//') ? requested : '/backoffice';
      try {
        const registrations = await navigator.serviceWorker?.getRegistrations?.() || [];
        await Promise.all(registrations.map((registration) => registration.unregister()));
        const keys = await caches?.keys?.() || [];
        await Promise.all(keys.map((key) => caches.delete(key)));
      } catch (_) {}
      try {
        Object.keys(localStorage).filter((key) => key.startsWith('taxiassur') || key.startsWith('sb-')).forEach((key) => localStorage.removeItem(key));
        sessionStorage.clear();
      } catch (_) {}
      location.replace(next + (next.includes('?') ? '&' : '?') + 'cache_reset=' + Date.now());
    })();
  </script>
</body>
</html>
