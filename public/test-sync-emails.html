<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Sync Emails - TaxiAssur</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    h1 {
      color: #1a202c;
      font-size: 32px;
      margin-bottom: 10px;
    }
    .subtitle {
      color: #718096;
      margin-bottom: 30px;
      font-size: 16px;
    }
    .info {
      background: #ebf8ff;
      border-left: 4px solid #3182ce;
      padding: 15px;
      margin-bottom: 25px;
      border-radius: 4px;
    }
    .info strong {
      display: block;
      margin-bottom: 5px;
      color: #2c5282;
    }
    .sync-section {
      background: #f7fafc;
      padding: 25px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    .button-group {
      display: flex;
      gap: 15px;
      margin-bottom: 20px;
    }
    button {
      padding: 14px 28px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
    }
    .btn-secondary {
      background: #48bb78;
      color: white;
    }
    .btn-secondary:hover:not(:disabled) {
      background: #38a169;
    }
    .btn-tertiary {
      background: #ed8936;
      color: white;
    }
    .btn-tertiary:hover:not(:disabled) {
      background: #dd6b20;
    }
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .results {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 20px;
      margin-top: 20px;
      max-height: 400px;
      overflow-y: auto;
    }
    .results h3 {
      color: #2d3748;
      margin-bottom: 15px;
      font-size: 18px;
    }
    .result-item {
      padding: 12px;
      background: #f7fafc;
      border-left: 3px solid #48bb78;
      margin-bottom: 10px;
      border-radius: 4px;
    }
    .result-item.error {
      border-left-color: #f56565;
      background: #fff5f5;
    }
    .result-item strong {
      display: block;
      margin-bottom: 5px;
      color: #2d3748;
    }
    .stat {
      display: inline-block;
      background: #edf2f7;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 13px;
      margin-right: 8px;
      color: #4a5568;
    }
    pre {
      background: #1a202c;
      color: #68d391;
      padding: 15px;
      border-radius: 6px;
      overflow-x: auto;
      font-size: 13px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔄 Test Synchronisation Emails</h1>
    <p class="subtitle">Synchronisation complète depuis Brevo, SendGrid et IONOS IMAP</p>

    <div class="info">
      <strong>ℹ️ Information</strong>
      Cette page vous permet de synchroniser manuellement tous les emails de team@taxiassur.com depuis les trois sources configurées.
    </div>

    <div class="sync-section">
      <div class="button-group">
        <button id="syncAllBtn" class="btn-primary" onclick="syncAllEmails()">
          <span id="syncAllSpinner" class="spinner" style="display: none;"></span>
          <span id="syncAllText">🚀 Synchroniser Tout</span>
        </button>
      </div>

      <div class="button-group">
        <button id="syncBrevoBtn" class="btn-secondary" onclick="syncBrevo()">
          <span id="syncBrevoSpinner" class="spinner" style="display: none;"></span>
          <span id="syncBrevoText">📧 Brevo uniquement</span>
        </button>
        <button id="syncSendGridBtn" class="btn-tertiary" onclick="syncSendGrid()">
          <span id="syncSendGridSpinner" class="spinner" style="display: none;"></span>
          <span id="syncSendGridText">📨 SendGrid uniquement</span>
        </button>
      </div>
    </div>

    <div id="results" style="display: none;" class="results">
      <h3>📊 Résultats de la synchronisation</h3>
      <div id="resultsContent"></div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = window.location.origin.includes('localhost')
      ? 'https://dxhwzhqmstkixokixfzm.supabase.co'
      : window.location.origin.replace('taxiassur.com', 'dxhwzhqmstkixokixfzm.supabase.co');

    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR4aHd6aHFtc3RraXhva2l4ZnptIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzQ1NDk5MTksImV4cCI6MjA1MDEyNTkxOX0.LOX7iyhsm95XVoIP12bGdRt0UaJTMNvxZ2T8LSL3pM8';

    async function callEdgeFunction(functionName, buttonPrefix) {
      const btn = document.getElementById(`${buttonPrefix}Btn`);
      const spinner = document.getElementById(`${buttonPrefix}Spinner`);
      const text = document.getElementById(`${buttonPrefix}Text`);

      btn.disabled = true;
      spinner.style.display = 'inline-block';
      text.textContent = 'Synchronisation...';

      try {
        const response = await fetch(
          `${SUPABASE_URL}/functions/v1/${functionName}`,
          {
            method: 'POST',
            headers: {
              'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({}),
          }
        );

        const data = await response.json();
        displayResults(data, functionName);
        return data;

      } catch (error) {
        displayError(error.message, functionName);
        throw error;
      } finally {
        btn.disabled = false;
        spinner.style.display = 'none';
        text.textContent = text.textContent.replace('Synchronisation...', getButtonText(functionPrefix));
      }
    }

    function getButtonText(prefix) {
      switch(prefix) {
        case 'syncAll': return '🚀 Synchroniser Tout';
        case 'syncBrevo': return '📧 Brevo uniquement';
        case 'syncSendGrid': return '📨 SendGrid uniquement';
        default: return 'Synchroniser';
      }
    }

    async function syncAllEmails() {
      await callEdgeFunction('sync-all-emails', 'syncAll');
    }

    async function syncBrevo() {
      await callEdgeFunction('sync-brevo-emails', 'syncBrevo');
    }

    async function syncSendGrid() {
      await callEdgeFunction('sync-sendgrid-emails', 'syncSendGrid');
    }

    function displayResults(data, functionName) {
      const resultsDiv = document.getElementById('results');
      const resultsContent = document.getElementById('resultsContent');

      resultsDiv.style.display = 'block';

      let html = `<div class="result-item">
        <strong>✅ ${functionName} - Terminé avec succès</strong>
        <div style="margin-top: 10px;">`;

      if (data.summary) {
        html += `<span class="stat">📊 Total en base: ${data.summary.total_emails_in_database}</span>`;

        if (data.summary.sync_results) {
          data.summary.sync_results.forEach(result => {
            if (result.data && result.data.stats) {
              html += `
                <div style="margin: 10px 0; padding: 10px; background: white; border-radius: 4px;">
                  <strong>${result.function}:</strong><br>
                  <span class="stat">✨ Récupérés: ${result.data.stats.total_retrieved || 0}</span>
                  <span class="stat">✅ Insérés: ${result.data.stats.inserted || 0}</span>
                  <span class="stat">⏭️ Ignorés: ${result.data.stats.skipped || 0}</span>
                  <span class="stat">❌ Erreurs: ${result.data.stats.errors || 0}</span>
                </div>`;
            }
          });
        }
      } else if (data.stats) {
        html += `
          <span class="stat">✨ Récupérés: ${data.stats.total_retrieved || 0}</span>
          <span class="stat">✅ Insérés: ${data.stats.inserted || 0}</span>
          <span class="stat">⏭️ Ignorés: ${data.stats.skipped || 0}</span>
          <span class="stat">❌ Erreurs: ${data.stats.errors || 0}</span>`;
      }

      html += `</div>
        <pre>${JSON.stringify(data, null, 2)}</pre>
      </div>`;

      resultsContent.innerHTML = html + resultsContent.innerHTML;
    }

    function displayError(message, functionName) {
      const resultsDiv = document.getElementById('results');
      const resultsContent = document.getElementById('resultsContent');

      resultsDiv.style.display = 'block';

      const html = `<div class="result-item error">
        <strong>❌ ${functionName} - Erreur</strong>
        <div style="margin-top: 10px; color: #c53030;">${message}</div>
      </div>`;

      resultsContent.innerHTML = html + resultsContent.innerHTML;
    }
  </script>
</body>
</html>
