<!DOCTYPE html>
<html>
<head>
    <title>Test Authentification Complet</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #1a1a1a;
            color: #00ff00;
            max-width: 1200px;
            margin: 0 auto;
        }
        .log { margin: 5px 0; padding: 5px; border-left: 3px solid #00ff00; }
        .error { color: #ff3333; border-left-color: #ff3333; }
        .success { color: #00ff00; border-left-color: #00ff00; }
        .info { color: #3399ff; border-left-color: #3399ff; }
        input { background: #333; color: #fff; padding: 8px; border: 1px solid #666; margin: 5px; }
        button { background: #00ff00; color: #000; padding: 10px 20px; border: none; cursor: pointer; margin: 5px; font-weight: bold; }
        pre { background: #333; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>🔍 Diagnostic Authentification TaxiAssur</h1>

    <div style="background: #333; padding: 20px; margin: 20px 0;">
        <input type="text" id="url" placeholder="SUPABASE_URL" style="width: 400px;">
        <input type="text" id="key" placeholder="SUPABASE_ANON_KEY" style="width: 400px;">
        <br>
        <input type="email" id="email" placeholder="Email" value="master@taxiassur.com">
        <input type="password" id="password" placeholder="Mot de passe">
        <br>
        <button onclick="testAuth()">🚀 Tester Connexion</button>
        <button onclick="clearLogs()">🗑️ Effacer</button>
    </div>

    <div id="output"></div>

    <script>
        const output = document.getElementById('output');
        let supabase = null;

        function log(msg, type = 'info') {
            const div = document.createElement('div');
            div.className = `log ${type}`;
            div.innerHTML = `${new Date().toISOString().substr(11, 8)} - ${msg}`;
            output.appendChild(div);
            output.scrollTop = output.scrollHeight;
        }

        function clearLogs() {
            output.innerHTML = '';
        }

        async function testAuth() {
            try {
                clearLogs();

                const url = document.getElementById('url').value;
                const key = document.getElementById('key').value;
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;

                if (!url || !key) {
                    log('❌ Veuillez renseigner URL et KEY', 'error');
                    return;
                }

                log('🔧 Initialisation Supabase...', 'info');
                supabase = window.supabase.createClient(url, key, {
                    auth: {
                        persistSession: true,
                        autoRefreshToken: true,
                        detectSessionInUrl: false
                    }
                });
                log('✅ Client Supabase créé', 'success');

                // Étape 1 : Connexion
                log('', 'info');
                log('━━━━━ ÉTAPE 1 : CONNEXION AUTH ━━━━━', 'info');
                log('📧 Tentative de connexion avec: ' + email, 'info');

                const startAuth = Date.now();
                const { data: authData, error: authError } = await supabase.auth.signInWithPassword({
                    email,
                    password
                });
                const authTime = Date.now() - startAuth;

                if (authError) {
                    log(`❌ Erreur auth (${authTime}ms): ${authError.message}`, 'error');
                    log(`📋 Code: ${authError.code || 'N/A'}`, 'error');
                    return;
                }

                log(`✅ Auth OK en ${authTime}ms`, 'success');
                log(`👤 User ID: ${authData.user.id}`, 'success');
                log(`📧 Email: ${authData.user.email}`, 'success');
                log(`🔑 Access Token: ${authData.session.access_token.substr(0, 20)}...`, 'success');

                // Étape 2 : Vérification session
                log('', 'info');
                log('━━━━━ ÉTAPE 2 : VÉRIFICATION SESSION ━━━━━', 'info');

                const { data: { session }, error: sessionError } = await supabase.auth.getSession();
                if (sessionError) {
                    log(`❌ Erreur session: ${sessionError.message}`, 'error');
                } else if (session) {
                    log('✅ Session valide trouvée', 'success');
                    log(`⏰ Expire dans: ${Math.round((session.expires_at * 1000 - Date.now()) / 60000)} min`, 'success');
                } else {
                    log('❌ Aucune session trouvée !', 'error');
                }

                // Étape 3 : Recherche dans admin_users
                log('', 'info');
                log('━━━━━ ÉTAPE 3 : RECHERCHE ADMIN_USERS ━━━━━', 'info');

                const startAdmin = Date.now();
                const { data: adminUser, error: adminError } = await supabase
                    .from('admin_users')
                    .select('id, email, full_name, role, is_active')
                    .eq('email', email)
                    .maybeSingle();
                const adminTime = Date.now() - startAdmin;

                if (adminError) {
                    log(`❌ Erreur admin_users (${adminTime}ms): ${adminError.message}`, 'error');
                    log(`📋 Code: ${adminError.code || 'N/A'}`, 'error');
                    log(`📋 Details: ${JSON.stringify(adminError.details || {})}`, 'error');
                    log(`📋 Hint: ${adminError.hint || 'N/A'}`, 'error');
                } else if (!adminUser) {
                    log(`❌ Aucun utilisateur admin trouvé pour ${email} (${adminTime}ms)`, 'error');

                    // Lister tous les admins
                    log('🔍 Liste de tous les admins...', 'info');
                    const { data: allAdmins } = await supabase
                        .from('admin_users')
                        .select('email, is_active, role');

                    if (allAdmins && allAdmins.length > 0) {
                        log(`📋 ${allAdmins.length} admin(s) trouvé(s):`, 'info');
                        allAdmins.forEach(a => {
                            log(`   - ${a.email} (${a.role}, actif: ${a.is_active})`, 'info');
                        });
                    } else {
                        log('❌ Aucun admin trouvé dans la table !', 'error');
                    }
                } else {
                    log(`✅ Admin trouvé en ${adminTime}ms`, 'success');
                    log(`👤 Nom: ${adminUser.full_name}`, 'success');
                    log(`📧 Email: ${adminUser.email}`, 'success');
                    log(`🎭 Role: ${adminUser.role}`, 'success');
                    log(`✅ Actif: ${adminUser.is_active}`, 'success');
                    log(`🆔 Admin ID: ${adminUser.id}`, 'success');
                    log(`🆔 Auth ID: ${authData.user.id}`, adminUser.id === authData.user.id ? 'success' : 'error');

                    if (adminUser.id !== authData.user.id) {
                        log('⚠️ ATTENTION: Les IDs ne correspondent pas !', 'error');
                        log('   Cela peut causer des problèmes d\'authentification', 'error');
                    }
                }

                // Étape 4 : Test du flow complet
                log('', 'info');
                log('━━━━━ ÉTAPE 4 : RÉSUMÉ ━━━━━', 'info');

                const checks = [];
                checks.push(['Auth Supabase', authData.user ? '✅' : '❌']);
                checks.push(['Session valide', session ? '✅' : '❌']);
                checks.push(['Admin trouvé', adminUser ? '✅' : '❌']);
                checks.push(['IDs match', (adminUser && adminUser.id === authData.user.id) ? '✅' : '❌']);
                checks.push(['Is active', (adminUser && adminUser.is_active) ? '✅' : '❌']);

                checks.forEach(([check, status]) => {
                    log(`${status} ${check}`, status === '✅' ? 'success' : 'error');
                });

                const allOk = checks.every(([_, status]) => status === '✅');
                log('', 'info');
                if (allOk) {
                    log('🎉 TOUS LES TESTS SONT OK ! La connexion devrait fonctionner.', 'success');
                } else {
                    log('❌ CERTAINS TESTS ONT ÉCHOUÉ. La connexion ne fonctionnera pas.', 'error');
                }

            } catch (err) {
                log(`❌ Erreur critique: ${err.message}`, 'error');
                console.error(err);
            }
        }

        // Auto-remplir les credentials si dans l'URL
        window.addEventListener('load', () => {
            const params = new URLSearchParams(window.location.search);
            if (params.get('url')) document.getElementById('url').value = params.get('url');
            if (params.get('key')) document.getElementById('key').value = params.get('key');
        });
    </script>
</body>
</html>
