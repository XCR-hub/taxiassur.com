<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagnostic Authentification Admin - TaxiAssur</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            color: #1a202c;
            margin-bottom: 8px;
            font-size: 32px;
        }
        .subtitle {
            color: #718096;
            margin-bottom: 32px;
            font-size: 16px;
        }
        .section {
            background: #f7fafc;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            border: 2px solid #e2e8f0;
        }
        .section h2 {
            color: #2d3748;
            margin-bottom: 16px;
            font-size: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .test-item {
            background: white;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 12px;
            border-left: 4px solid #cbd5e0;
        }
        .test-item.success {
            border-left-color: #48bb78;
            background: #f0fff4;
        }
        .test-item.error {
            border-left-color: #f56565;
            background: #fff5f5;
        }
        .test-item.warning {
            border-left-color: #ed8936;
            background: #fffaf0;
        }
        .test-name {
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 8px;
        }
        .test-result {
            font-size: 14px;
            color: #4a5568;
        }
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 32px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 16px;
            transition: transform 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        label {
            font-weight: 600;
            color: #2d3748;
            font-size: 14px;
        }
        input {
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        .code-block {
            background: #1a202c;
            color: #68d391;
            padding: 16px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            overflow-x: auto;
            margin-top: 12px;
        }
        .icon-success { color: #48bb78; }
        .icon-error { color: #f56565; }
        .icon-warning { color: #ed8936; }
        .icon-info { color: #4299e1; }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #e2e8f0;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 Diagnostic Authentification Admin</h1>
        <p class="subtitle">TaxiAssur Backoffice - Test de connexion et diagnostic</p>

        <div class="section">
            <h2>📝 Test de Connexion</h2>
            <form id="loginForm" class="login-form">
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="master@taxiassur.com" value="master@taxiassur.com">
                </div>
                <div class="input-group">
                    <label for="password">Mot de passe</label>
                    <input type="password" id="password" placeholder="Votre mot de passe">
                </div>
                <button type="submit" class="btn" id="loginBtn">Tester la Connexion</button>
            </form>
            <div id="loginResult"></div>
        </div>

        <div class="section">
            <h2>🔍 Tests Automatiques</h2>
            <button class="btn" onclick="runAllTests()">Lancer les Tests</button>
            <div id="testResults"></div>
        </div>

        <div class="section">
            <h2>📊 État du Système</h2>
            <div id="systemStatus"></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://xxunrkyfavznfoxfqgci.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh4dW5ya3lmYXZ6bmZveGZxZ2NpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzQ3MTA0MTQsImV4cCI6MjA1MDI4NjQxNH0.vc-LKqBJPKK5NmA1dBFCt1aR9EVyZN5L0q-FBdLVBzo';

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Fonction d'affichage de test
        function displayTest(name, result, status, details = '') {
            const icon = status === 'success' ? '✅' : status === 'error' ? '❌' : status === 'warning' ? '⚠️' : 'ℹ️';
            return `
                <div class="test-item ${status}">
                    <div class="test-name">${icon} ${name}</div>
                    <div class="test-result">${result}</div>
                    ${details ? `<div class="code-block">${details}</div>` : ''}
                </div>
            `;
        }

        // Test de connexion
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');
            const resultDiv = document.getElementById('loginResult');

            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span> Connexion en cours...';
            resultDiv.innerHTML = '';

            try {
                console.log('🔐 Tentative de connexion:', email);

                const { data, error } = await supabase.auth.signInWithPassword({
                    email,
                    password
                });

                if (error) throw error;

                if (data.user) {
                    // Vérifier l'utilisateur admin
                    const { data: adminUser, error: adminError } = await supabase
                        .from('admin_users')
                        .select('*')
                        .eq('email', email)
                        .maybeSingle();

                    let html = displayTest(
                        'Authentification Supabase',
                        `✅ Connexion réussie pour ${email}`,
                        'success',
                        `User ID: ${data.user.id}\nSession: ${data.session ? 'Active' : 'Inactive'}`
                    );

                    if (adminError) {
                        html += displayTest(
                            'Vérification Admin',
                            `❌ Erreur: ${adminError.message}`,
                            'error',
                            JSON.stringify(adminError, null, 2)
                        );
                    } else if (adminUser) {
                        html += displayTest(
                            'Profil Admin',
                            `✅ Utilisateur trouvé: ${adminUser.full_name} (${adminUser.role})`,
                            'success',
                            `Email: ${adminUser.email}\nActif: ${adminUser.is_active}\nRôle: ${adminUser.role}`
                        );

                        // Tester les permissions
                        const { data: permissions, error: permError } = await supabase
                            .from('user_permissions')
                            .select('*')
                            .eq('user_id', adminUser.id);

                        if (!permError) {
                            html += displayTest(
                                'Permissions',
                                `✅ ${permissions.length} permission(s) configurée(s)`,
                                'success',
                                JSON.stringify(permissions, null, 2)
                            );
                        }
                    } else {
                        html += displayTest(
                            'Profil Admin',
                            '❌ Utilisateur non trouvé dans admin_users',
                            'error',
                            `L'authentification a réussi mais l'utilisateur n'existe pas dans la table admin_users.\nCréez l'utilisateur avec:\n\nINSERT INTO admin_users (id, email, full_name, role, is_active)\nVALUES ('${data.user.id}', '${email}', 'Master Admin', 'master', true);`
                        );
                    }

                    resultDiv.innerHTML = html;
                } else {
                    resultDiv.innerHTML = displayTest(
                        'Connexion',
                        '❌ Aucun utilisateur retourné',
                        'error'
                    );
                }
            } catch (err) {
                console.error('Erreur:', err);
                resultDiv.innerHTML = displayTest(
                    'Connexion',
                    `❌ Erreur: ${err.message}`,
                    'error',
                    JSON.stringify(err, null, 2)
                );
            } finally {
                btn.disabled = false;
                btn.textContent = 'Tester la Connexion';
            }
        });

        // Tests automatiques
        async function runAllTests() {
            const resultsDiv = document.getElementById('testResults');
            resultsDiv.innerHTML = '<div class="loading"></div> Tests en cours...';
            let html = '';

            // Test 1: Connexion Supabase
            try {
                const { data, error } = await supabase.from('admin_users').select('count').limit(1);
                html += displayTest(
                    '1. Connexion Supabase',
                    error ? `❌ ${error.message}` : '✅ Connexion établie',
                    error ? 'error' : 'success'
                );
            } catch (err) {
                html += displayTest('1. Connexion Supabase', `❌ ${err.message}`, 'error');
            }

            // Test 2: Table admin_users
            try {
                const { data, error } = await supabase
                    .from('admin_users')
                    .select('email, full_name, role, is_active')
                    .order('created_at', { ascending: false })
                    .limit(5);

                if (error) throw error;
                html += displayTest(
                    '2. Table admin_users',
                    `✅ ${data.length} utilisateur(s) trouvé(s)`,
                    'success',
                    data.map(u => `${u.full_name} (${u.email}) - ${u.role} - ${u.is_active ? 'Actif' : 'Inactif'}`).join('\n')
                );
            } catch (err) {
                html += displayTest('2. Table admin_users', `❌ ${err.message}`, 'error');
            }

            // Test 3: Session active
            try {
                const { data: { session }, error } = await supabase.auth.getSession();
                html += displayTest(
                    '3. Session Active',
                    session ? `✅ Session trouvée pour ${session.user.email}` : '⚠️ Aucune session active',
                    session ? 'success' : 'warning',
                    session ? `Expire: ${new Date(session.expires_at * 1000).toLocaleString('fr-FR')}` : ''
                );
            } catch (err) {
                html += displayTest('3. Session Active', `❌ ${err.message}`, 'error');
            }

            // Test 4: RLS Policies
            try {
                const { data, error } = await supabase
                    .from('admin_users')
                    .select('*')
                    .limit(1);

                html += displayTest(
                    '4. RLS Policies',
                    error ? `⚠️ ${error.message}` : '✅ Accès autorisé',
                    error?.code === '42501' ? 'warning' : (error ? 'error' : 'success'),
                    error ? 'Les politiques RLS bloquent l\'accès sans authentification (normal)' : ''
                );
            } catch (err) {
                html += displayTest('4. RLS Policies', `❌ ${err.message}`, 'error');
            }

            resultsDiv.innerHTML = html;
        }

        // État du système
        async function checkSystemStatus() {
            const statusDiv = document.getElementById('systemStatus');
            let html = '';

            // Vérifier localStorage
            const cache = localStorage.getItem('taxiassur-admin-session');
            const userCache = localStorage.getItem('taxiassur_user');

            html += displayTest(
                'Cache Local',
                cache ? '✅ Session en cache' : '⚠️ Pas de session en cache',
                cache ? 'success' : 'warning'
            );

            html += displayTest(
                'Cache Utilisateur',
                userCache ? '✅ Utilisateur en cache' : '⚠️ Pas d\'utilisateur en cache',
                userCache ? 'success' : 'warning'
            );

            // Vérifier URL et clés
            html += displayTest(
                'Configuration',
                `Supabase URL: ${SUPABASE_URL}\nClé configurée: ${SUPABASE_ANON_KEY.substring(0, 20)}...`,
                'info'
            );

            statusDiv.innerHTML = html;
        }

        // Charger l'état au démarrage
        checkSystemStatus();
    </script>
</body>
</html>
