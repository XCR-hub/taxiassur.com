name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      VITE_CAPTCHA_PROVIDER: turnstile
      VITE_TURNSTILE_SITE_KEY: "${{ vars.VITE_TURNSTILE_SITE_KEY || secrets.VITE_TURNSTILE_SITE_KEY || '0x4AAAAAAEAauofq7vsai3yI' }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security secret scan
        run: npm run security:scan-secrets

      - name: Client compliance guard
        run: npm run verify:client-compliance

      - name: Build and validate Cloudflare output
        run: npm run build:cloudflare

      - name: Check Cloudflare secrets
        id: cloudflare
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deploy skipped: missing CLOUDFLARE_ACCOUNT_ID or CLOUDFLARE_API_TOKEN."
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare Pages production
        if: steps.cloudflare.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name taxiassur --branch main

      - name: Verify production site
        if: steps.cloudflare.outputs.ready == 'true'
        env:
          SITE_URL: https://taxiassur.com
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if npm run verify:production; then
              exit 0
            fi
            echo "Production verification failed on attempt ${attempt}; retrying in 10s..."
            sleep 10
          done
          npm run verify:production