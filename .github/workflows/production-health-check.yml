name: Production Health Check

on:
  schedule:
    - cron: '37 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-health-check
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify deployment independence
        run: npm run verify:deployment-independence

      - name: Verify production site and public caches
        env:
          SITE_URL: https://taxiassur.com
          EXPECTED_COMMIT: skip
          PUBLIC_MIRROR_COUNT_TOLERANCE: '10'
          PUBLIC_MIRROR_GSC_COUNT_TOLERANCE: '25'
        run: |
          for attempt in $(seq 1 12); do
            if npm run verify:production; then
              exit 0
            fi
            echo "Production health check failed on attempt ${attempt}; retrying in 15s..."
            sleep 15
          done
          npm run verify:production

      - name: Verify production backoffice auth
        env:
          SITE_URL: https://taxiassur.com
        run: npm run verify:backoffice-auth

      - name: Verify production SEO signals
        env:
          SITE_URL: https://taxiassur.com
          EXPECTED_COMMIT: skip
        run: npm run verify:seo-leadership

      - name: Verify public publication automations
        env:
          SITE_URL: https://taxiassur.com
          PUBLIC_MIRROR_COUNT_TOLERANCE: '10'
          PUBLIC_MIRROR_GSC_COUNT_TOLERANCE: '25'
        run: npm run verify:publications

      - name: SEO quality audit
        run: npm run seo:quality-audit
