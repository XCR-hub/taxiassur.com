name: Production Health Check

on:
  schedule:
    - cron: '37 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-health-check
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify deployment independence
        run: npm run verify:deployment-independence

      # Scheduled Actions can be delayed; refresh stale data before verifying it.
      - name: Check public cache age
        id: cache
        run: node scripts/check-d1-refresh-needed.cjs

      - name: Refresh expired public cache
        if: steps.cache.outputs.refresh == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run d1:refresh-public-cache
      - name: Verify production site and public caches
        env:
          SITE_URL: https://taxiassur.com
          EXPECTED_COMMIT: skip
          PUBLIC_MIRROR_COUNT_TOLERANCE: '10'
          PUBLIC_MIRROR_GSC_COUNT_TOLERANCE: '25'
          REQUIRE_D1_CACHE_METADATA: '1'
          # PostgreSQL is the native source of truth; import timestamps only apply to legacy mirror jobs.
          REQUIRE_POSTGRES_IMPORT_METADATA: '0'
          MAX_D1_CACHE_AGE_HOURS: '4'
          MAX_POSTGRES_IMPORT_AGE_HOURS: '4'
        run: |
          for attempt in $(seq 1 12); do
            if npm run verify:production; then
              exit 0
            fi
            echo "Production health check failed on attempt ${attempt}; retrying in 15s..."
            sleep 15
          done
          npm run verify:production

      - name: Verify production backoffice auth
        env:
          SITE_URL: https://taxiassur.com
        run: npm run verify:backoffice-auth

      - name: Verify production SEO signals
        env:
          SITE_URL: https://taxiassur.com
          EXPECTED_COMMIT: skip
        run: npm run verify:seo-leadership

      - name: Verify public publication automations
        env:
          SITE_URL: https://taxiassur.com
          PUBLIC_MIRROR_COUNT_TOLERANCE: '10'
          PUBLIC_MIRROR_GSC_COUNT_TOLERANCE: '25'
        run: npm run verify:publications

      - name: Verify taxi acquisition pages and Google data freshness
        run: npm run audit:acquisition

      - name: SEO quality audit
        run: npm run seo:quality-audit
