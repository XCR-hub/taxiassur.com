name: Deploy critical Supabase functions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/functions/upload-client-document/**"
      - "supabase/functions/sign-document-url/**"
      - "supabase/functions/trend-analyzer-proxy/**"
      - "supabase/functions/send-payment-link-email/**"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: drohhxrkoequjphvabvq
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Explain missing deployment credential
        if: env.SUPABASE_ACCESS_TOKEN == ''
        run: |
          echo "SUPABASE_ACCESS_TOKEN is missing. Add it as a repository secret, then rerun this workflow."
          exit 1

      - name: Deploy prospect document upload
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: npx --yes supabase@latest functions deploy upload-client-document --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy secure document signing
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: npx --yes supabase@latest functions deploy sign-document-url --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy secured trend analyzer
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: npx --yes supabase@latest functions deploy trend-analyzer-proxy --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy secured payment-link email
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: npx --yes supabase@latest functions deploy send-payment-link-email --project-ref "$SUPABASE_PROJECT_REF"
