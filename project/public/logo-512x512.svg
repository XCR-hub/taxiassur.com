<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="#1E293B"/>

  <!-- Shield with gradient -->
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFB800;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8C00;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Main shield -->
  <path d="M256 80C256 80 320 50 360 50C400 50 464 80 464 80V240C464 360 400 440 360 480C320 440 256 360 256 240V80Z"
        fill="url(#shieldGrad)"
        filter="url(#shadow)"
        transform="translate(-104, 0)"/>

  <!-- Inner shield highlight -->
  <path d="M256 90C256 90 315 65 350 65C385 65 444 90 444 90V235C444 345 385 420 350 455C315 420 256 345 256 235V90Z"
        fill="white"
        opacity="0.1"
        transform="translate(-104, 0)"/>

  <!-- Checkmark -->
  <path d="M200 270L240 310L320 230"
        stroke="white"
        stroke-width="20"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#shadow)"/>

  <!-- Taxi icon -->
  <rect x="220" y="180" width="80" height="40" rx="5" fill="white" opacity="0.3"/>

  <!-- Taxi wheels -->
  <circle cx="240" cy="230" r="12" fill="white"/>
  <circle cx="280" cy="230" r="12" fill="white"/>

  <!-- Taxi light -->
  <rect x="245" y="165" width="30" height="12" rx="3" fill="#FFB800"/>

  <!-- Text TAXIASSUR -->
  <text x="256" y="400"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="60"
        font-weight="bold"
        fill="white"
        filter="url(#shadow)">
    TAXIASSUR
  </text>

  <!-- Tagline -->
  <text x="256" y="445"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="28"
        fill="#FFB800">
    Assurance Taxi Professionnelle
  </text>
</svg>
