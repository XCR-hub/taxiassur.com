<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Diagnostic TaxiAssur</title>
    <style>
        body {
            font-family: monospace;
            background: #000;
            color: #0f0;
            padding: 20px;
            line-height: 1.6;
        }
        .ok { color: #0f0; }
        .error { color: #f00; }
        .warning { color: #ff0; }
        h1 { color: #fff; }
    </style>
</head>
<body>
    <h1>🚨 Diagnostic TaxiAssur - Écran Noir</h1>
    <div id="results"></div>

    <script>
        const results = document.getElementById('results');

        function log(msg, type = 'ok') {
            const p = document.createElement('p');
            p.className = type;
            p.textContent = msg;
            results.appendChild(p);
            console.log(msg);
        }

        // Test 1: JavaScript fonctionne
        log('✅ JavaScript fonctionne', 'ok');

        // Test 2: Variables d'environnement
        if (window.ENV_CONFIG) {
            log('✅ ENV_CONFIG chargé', 'ok');
            log('   - SUPABASE_URL: ' + (window.ENV_CONFIG.VITE_SUPABASE_URL ? 'OK' : 'MANQUANT'),
                window.ENV_CONFIG.VITE_SUPABASE_URL ? 'ok' : 'error');
            log('   - SUPABASE_KEY: ' + (window.ENV_CONFIG.VITE_SUPABASE_ANON_KEY ? 'OK' : 'MANQUANT'),
                window.ENV_CONFIG.VITE_SUPABASE_ANON_KEY ? 'ok' : 'error');
        } else {
            log('❌ ENV_CONFIG non chargé - env-config.js manquant ?', 'error');
        }

        // Test 3: Fichiers uploadés
        log('---', 'ok');
        log('Vérification fichiers...', 'warning');

        fetch('/env-config.js')
            .then(r => log('✅ /env-config.js existe (status ' + r.status + ')', 'ok'))
            .catch(() => log('❌ /env-config.js manquant ou inaccessible', 'error'));

        fetch('/assets/')
            .then(r => log('✅ /assets/ accessible (status ' + r.status + ')', 'ok'))
            .catch(() => log('❌ /assets/ manquant ou inaccessible', 'error'));

        // Test 4: Console errors
        log('---', 'ok');
        log('⚠️ IMPORTANT: Ouvrez la console (F12 > Console) et cherchez les erreurs en rouge', 'warning');

        // Test 5: URL actuelle
        log('---', 'ok');
        log('URL: ' + window.location.href, 'ok');
        log('Host: ' + window.location.host, 'ok');
        log('Protocol: ' + window.location.protocol, 'ok');

        // Test 6: Tentative de vérifier React
        setTimeout(() => {
            const root = document.getElementById('root');
            if (!root) {
                log('❌ div#root introuvable dans index.html', 'error');
            } else if (!root.innerHTML || root.innerHTML.trim() === '') {
                log('❌ React non chargé - div#root vide', 'error');
                log('   CAUSE PROBABLE: Le bundle JavaScript ne se charge pas', 'error');
            } else {
                log('✅ React semble chargé (div#root a du contenu)', 'ok');
            }
        }, 3000);

        log('---', 'ok');
        log('📋 ACTIONS À FAIRE:', 'warning');
        log('1. Uploader env-config.js à la racine du site', 'warning');
        log('2. Uploader le dossier /assets/ complet', 'warning');
        log('3. Uploader index.html à la racine', 'warning');
        log('4. Vider le cache navigateur (Ctrl+Shift+R)', 'warning');
        log('5. M\'envoyer une capture d\'écran de la console (F12 > Console)', 'warning');
        log('---', 'ok');
        log('Si vous voyez ce message, JavaScript fonctionne.', 'ok');
        log('Le problème est probablement un fichier manquant ou mal uploadé.', 'warning');
    </script>
</body>
</html>
