<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Génération IA - Diagnostic</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: #e2e8f0;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 1.5rem;
            color: #f59e0b;
            text-align: center;
        }

        .card {
            background: #1e293b;
            border: 2px solid #334155;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
        }

        .card h2 {
            font-size: 1.25rem;
            margin-bottom: 16px;
            color: #fbbf24;
        }

        .status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 999px;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .status.success {
            background: #10b981;
            color: white;
        }

        .status.error {
            background: #ef4444;
            color: white;
        }

        .status.pending {
            background: #6b7280;
            color: white;
        }

        button {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        pre {
            background: #0f172a;
            padding: 16px;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 0.875rem;
            line-height: 1.6;
            border: 1px solid #334155;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }

        .stat {
            background: #334155;
            padding: 16px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            color: #fbbf24;
            margin-bottom: 8px;
        }

        .stat-label {
            font-size: 0.875rem;
            color: #94a3b8;
        }

        .log {
            background: #0f172a;
            padding: 16px;
            border-radius: 8px;
            max-height: 400px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.875rem;
            line-height: 1.8;
            border: 1px solid #334155;
        }

        .log-entry {
            margin-bottom: 8px;
            padding: 8px;
            border-radius: 4px;
        }

        .log-entry.success {
            background: rgba(16, 185, 129, 0.1);
            color: #10b981;
        }

        .log-entry.error {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
        }

        .log-entry.info {
            background: rgba(59, 130, 246, 0.1);
            color: #3b82f6;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 Diagnostic Génération IA Réseaux Sociaux</h1>

        <div class="card">
            <h2>📊 Configuration Actuelle</h2>
            <div class="grid">
                <div class="stat">
                    <div class="stat-value" id="supabase-status">-</div>
                    <div class="stat-label">Supabase</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="templates-count">-</div>
                    <div class="stat-label">Templates Viraux</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="openai-status">-</div>
                    <div class="stat-label">OpenAI API</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="function-status">-</div>
                    <div class="stat-label">Edge Function</div>
                </div>
            </div>
        </div>

        <div class="card">
            <h2>🧪 Test Génération IA</h2>
            <button id="test-btn" onclick="testGeneration()">
                Lancer Test Génération
            </button>
        </div>

        <div class="card">
            <h2>📋 Logs en Temps Réel</h2>
            <div class="log" id="logs"></div>
        </div>

        <div class="card" id="response-card" style="display: none;">
            <h2>📥 Réponse API Complète</h2>
            <pre id="response-data"></pre>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://drohhxrkoequjphvabvq.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRyb2hoeHJrb2VxdWpwaHZhYnZxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Mjg0MDE2MTEsImV4cCI6MjA0Mzk3NzYxMX0.W4k3lQRiOu3KY_B1bAGPO-TkQKcTU3pNhZBPPCK2BmY';

        function addLog(message, type = 'info') {
            const logs = document.getElementById('logs');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logs.appendChild(entry);
            logs.scrollTop = logs.scrollHeight;
        }

        async function checkSupabase() {
            try {
                addLog('Vérification connexion Supabase...', 'info');
                const response = await fetch(`${SUPABASE_URL}/rest/v1/`, {
                    headers: {
                        'apikey': SUPABASE_KEY
                    }
                });

                if (response.ok) {
                    document.getElementById('supabase-status').textContent = '✅';
                    addLog('✅ Supabase connecté', 'success');
                    return true;
                } else {
                    document.getElementById('supabase-status').textContent = '❌';
                    addLog('❌ Erreur connexion Supabase', 'error');
                    return false;
                }
            } catch (error) {
                document.getElementById('supabase-status').textContent = '❌';
                addLog(`❌ Erreur: ${error.message}`, 'error');
                return false;
            }
        }

        async function checkTemplates() {
            try {
                addLog('Vérification templates viraux...', 'info');
                const response = await fetch(`${SUPABASE_URL}/rest/v1/viral_templates?select=count`, {
                    method: 'HEAD',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Prefer': 'count=exact'
                    }
                });

                const count = response.headers.get('content-range')?.split('/')[1] || '0';

                document.getElementById('templates-count').textContent = count;

                if (parseInt(count) > 0) {
                    addLog(`✅ ${count} templates viraux trouvés`, 'success');
                    return true;
                } else {
                    addLog('❌ AUCUN template viral en base !', 'error');
                    addLog('→ Action requise: Exécuter PEUPLER-VILLES-ET-TEMPLATES-MAINTENANT.sql', 'error');
                    return false;
                }
            } catch (error) {
                document.getElementById('templates-count').textContent = '❌';
                addLog(`❌ Erreur vérification templates: ${error.message}`, 'error');
                return false;
            }
        }

        async function checkEdgeFunction() {
            try {
                addLog('Vérification Edge Function ai-viral-content-generator...', 'info');

                // Tentative ping Edge Function
                const response = await fetch(`${SUPABASE_URL}/functions/v1/ai-viral-content-generator`, {
                    method: 'OPTIONS',
                    headers: {
                        'Authorization': `Bearer ${SUPABASE_KEY}`
                    }
                });

                if (response.ok || response.status === 204) {
                    document.getElementById('function-status').textContent = '✅';
                    addLog('✅ Edge Function accessible', 'success');
                    return true;
                } else {
                    document.getElementById('function-status').textContent = '❌';
                    addLog(`❌ Edge Function non accessible (${response.status})`, 'error');
                    return false;
                }
            } catch (error) {
                document.getElementById('function-status').textContent = '❌';
                addLog(`❌ Erreur Edge Function: ${error.message}`, 'error');
                return false;
            }
        }

        async function testGeneration() {
            const btn = document.getElementById('test-btn');
            btn.disabled = true;
            btn.textContent = 'Test en cours...';

            // Reset logs
            document.getElementById('logs').innerHTML = '';
            document.getElementById('response-card').style.display = 'none';

            addLog('🚀 Démarrage test génération IA', 'info');
            addLog('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━', 'info');

            // Vérifications préalables
            await checkSupabase();
            await checkTemplates();
            await checkEdgeFunction();

            addLog('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━', 'info');
            addLog('Appel Edge Function ai-viral-content-generator...', 'info');

            try {
                const startTime = Date.now();

                const response = await fetch(`${SUPABASE_URL}/functions/v1/ai-viral-content-generator`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${SUPABASE_KEY}`
                    },
                    body: JSON.stringify({
                        category: 'conseil',
                        topic: 'assurance taxi - économiser sur ses cotisations',
                        target_audience: 'chauffeurs de taxi professionnels',
                        platforms: ['facebook', 'linkedin'],
                        auto_publish: false
                    })
                });

                const duration = Date.now() - startTime;
                addLog(`⏱️  Temps réponse: ${duration}ms`, 'info');

                const responseText = await response.text();
                let responseData;

                try {
                    responseData = JSON.parse(responseText);
                } catch (e) {
                    responseData = { raw: responseText };
                }

                // Afficher réponse complète
                document.getElementById('response-card').style.display = 'block';
                document.getElementById('response-data').textContent = JSON.stringify(responseData, null, 2);

                if (response.ok && responseData.success) {
                    addLog('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━', 'success');
                    addLog('✅ GÉNÉRATION RÉUSSIE !', 'success');
                    addLog(`Template utilisé: ${responseData.template_used}`, 'success');
                    addLog(`Potentiel viral: ${responseData.viral_potential}`, 'success');
                    addLog(`Score humanisation: ${responseData.humanization_score}%`, 'success');
                    addLog(`Posts générés: ${responseData.posts?.length || 0}`, 'success');

                    if (responseData.posts && responseData.posts.length > 0) {
                        addLog('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━', 'info');
                        addLog('📝 Contenu généré:', 'info');
                        addLog(responseData.posts[0].content.substring(0, 200) + '...', 'info');
                    }

                    document.getElementById('openai-status').textContent = '✅';
                } else {
                    addLog('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━', 'error');
                    addLog('❌ GÉNÉRATION ÉCHOUÉE', 'error');
                    addLog(`Status: ${response.status}`, 'error');
                    addLog(`Erreur: ${responseData.error || 'Inconnue'}`, 'error');

                    // Diagnostic erreurs courantes
                    if (responseData.error?.includes('OPENAI_API_KEY')) {
                        addLog('→ Clé OpenAI non configurée dans Supabase Secrets', 'error');
                    } else if (responseData.error?.includes('No viral template')) {
                        addLog('→ Aucun template viral en base', 'error');
                        addLog('→ Exécuter: PEUPLER-VILLES-ET-TEMPLATES-MAINTENANT.sql', 'error');
                    } else if (responseData.error?.includes('429')) {
                        addLog('→ Rate limit OpenAI dépassé', 'error');
                    } else if (responseData.error?.includes('401')) {
                        addLog('→ Clé OpenAI invalide', 'error');
                    }

                    document.getElementById('openai-status').textContent = '❌';
                }

            } catch (error) {
                addLog('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━', 'error');
                addLog(`❌ ERREUR CRITIQUE: ${error.message}`, 'error');
                addLog('Vérifier console navigateur (F12) pour détails', 'error');
                console.error('Erreur complète:', error);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Relancer Test';
                addLog('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━', 'info');
            }
        }

        // Lancer checks au chargement
        window.addEventListener('load', async () => {
            addLog('🔍 Vérification configuration initiale...', 'info');
            await checkSupabase();
            await checkTemplates();
            await checkEdgeFunction();
            addLog('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━', 'info');
            addLog('Prêt pour le test. Cliquez sur "Lancer Test Génération"', 'success');
        });
    </script>
</body>
</html>
